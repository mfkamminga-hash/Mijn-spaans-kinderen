<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d3a0"><title>Rekenavonturen van Helena & Lorraine</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#3b5260;background:#fff8ed}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff5df,#e8f8f3);min-height:100vh}header{background:#fff9ed;padding:22px 16px;text-align:center;border-bottom:5px solid #f8d89a}h1{margin:0;font-size:clamp(25px,5vw,39px)}header p{margin:8px 0}.wrap{max-width:980px;margin:auto;padding:20px}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:4px solid #2e9bb0;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.pill{background:#fff;border:2px solid #e8dcc7;border-radius:20px;padding:10px 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.lesson{background:#fff;border:2px solid #f2dfb8;border-radius:22px;text-align:left;padding:15px;min-height:108px;box-shadow:0 4px 0 #ead9bc}.lesson.done{background:#e1f6df;border-color:#80bd83}.lesson b{display:block;margin:5px 0;font-size:17px}.lesson small{color:#697987}.emoji{font-size:27px}.panel{background:#fffdf8;border:3px solid #f0d6a8;border-radius:28px;padding:clamp(15px,4vw,32px);box-shadow:0 8px 0 #f2e0c6}.game{margin:18px 0;padding:22px 10px;background:#eff9f4;border-radius:22px;text-align:center;min-height:250px}.game h2{font-size:clamp(22px,4vw,30px)}.objects{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px auto;max-width:650px}.object{font-size:clamp(29px,6vw,48px);background:#fff;border-radius:17px;padding:7px}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.choice{background:#fff;border:3px solid #e6d2a7;border-radius:18px;padding:14px 20px;font-size:clamp(24px,5vw,38px);min-width:75px;min-height:75px}.choice-pictures{display:block;font-size:25px;line-height:1.5;max-width:180px;overflow-wrap:anywhere}.choice-number{font-size:16px;color:#697987}.choice:active,.lesson:active{transform:scale(.9 </style></head><body><header><h1>🌈 Rekenavonturen</h1><p>Voor Helena & Lorraine · Samen spelen en ontdekken</p></header><main class="wrap"><section id="home"><div class="toolbar"><div class="pill" id="progress">0 van 53 lessen gedaan</div><button class="pill" id="sound">🔔 Geluid aan</button></div><div class="bar"><span id="bar" style="width:0%"></span></div><p>Kies een les. Iedere les heeft vier korte spelletjes. Samen spelen mag!</p><div id="lessons" class="grid"></div></section><section id="play" class="hidden"><div class="toolbar"><button id="back" class="secondary">← Alle lessen</button><span id="step" class="pill"></span></div><div class="panel"><div id="heading"></div><div class="game" id="game"></div><div class="status" id="status" aria-live="polite"></div><div class="toolbar"><button id="prev" class="secondary">← Vorig spel</button><button id="retry" class="secondary">🔄 Nog eens</button><button id="next" class="primary">Volgend spel →</button><button id="finish" class="primary hidden">✓ Les afronden</button></div></div></section></main><footer>Met liefde gemaakt voor samen leren · Je voortgang blijft op dit apparaat bewaard.</footer><script>

Id":"week-37"},{"id":48,"theme":"Noten & zaden","title":"De voorraadkast","icon":"🌰","limit":15,"date":"2027-09-20","plannerThemeId":"week-38"},{"id":49,"theme":"Herfstdieren","title":"Dieren in hun hol","icon":"🦊","limit":15,"date":"2027-09-27","plannerThemeId":"week-39"},{"id":50,"theme":"Regen","title":"Plassen en druppels","icon":"💦","limit":20,"date":"2027-10-04","plannerThemeId":"week-40"},{"id":51,"theme":"Licht & donker","title":"Tel de sterren","icon":"⭐","limit":20,"date":"2027-10-11","plannerThemeId":"week-41"},{"id":52,"theme":"Kunst & creatief","title":"Het kunstatelier","icon":"🎨","limit":20,"date":"2027-10-18","plannerThemeId":"week-42"},{"id":53,"theme":"Bouwen","title":"De blokkentoren","icon":"🧱","limit":20,"date":"2027-10-25","plannerThemeId":"week-43"}];const KEY='helena-lorraine-rekenen-v1';let done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]')),sound=localStorage.getItem(KEY+'-sound')!=='off',lesson=0,step=0,round=null,solved=false;const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>a.sort(()=>Math.random()-.5),obj=n=>Array.from({length:n},()=>'<span class="object">'+LESSONS[lesson].icon+'</span>').join(''),opts=(values,fn)=>'<div class="choices">'+values.map(v=>'<button class="choice" data-answer="'+v+'">'+(lesson<16&&typeof v==='number'?'<span class="choice-pictures">'+LESSONS[lesson].icon.repeat(v)+'</span><span class="choice-number">'+v+'</span>':v)+'</button>').join('')+'</div>';function beep(ok){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?620:230;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.start();o.stop(c.currentTime+.17);setTimeout(()=>c.close(),350)}catch(e){}}function update(){ $('progress').textContent=done.size+' van 53 lessen gedaan';$('bar').style.width=(done.size/53*100)+'%';$('lessons').innerHTML=LESSONS.map((l,i)=>'<button class="lesson '+(done.has(i)?'done':'')+'" data-lesson="'+i+'"><span class="emoji">'+l.icon+'</span> <b>Les '+l.id+' · '+l.title+' '+(done.has(i)?'✓':'')+'</b><small>Vanaf '+l.date.split('-').reverse().join('-')+' · Weekthema: '+l.theme+'</small></button>').join('');$('lessons').querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson));$('sound').textContent=sound?'🔔 Geluid aan':'🔕 Geluid uit'}function openLesson(i){lesson=i;step=0;history.replaceState(null,'','?les='+(i+1));$('home').classList.add('hidden');$('play').classList.remove('hidden');render();window.scrollTo(0,0)}function max(){return LESSONS[lesson].limit}function setRound(){let cap=max(),a,b;switch(step){case 0:{let n=rnd(1,cap);round={n,correct:n,choices:shuffle([...new Set([n,Math.max(1,n-1),Math.min(cap,n+1),Math.max(1,n-2),Math.min(cap,n+2)])]).slice(0,4)};if(!round.choices.includes(n))round.choices[0]=n;break}case 1:{a=rnd(1,Math.max(2,cap-3));b=rnd(1,Math.max(2,cap-3));if(a===b)b=Math.min(cap,b+1);round={a,b,correct:a>b?'links':'rechts'};break}case 2:{a=rnd(1,Math.min(lesson<15?4:lesson<35?7:10,cap-1));b=rnd(1,Math.min(lesson<15?4:lesson<35?7:10,cap-a));round={a,b,correct:a+b,choices:shuffle([...new Set([a+b,Math.max(1,a+b-1),Math.min(cap,a+b+1),Math.max(1,a+b-2)])])};break}case 3:{a=rnd(1,cap-2);b=rnd(1,cap-a);round={a,b,correct:'meer'};break}}}function render(){solved=false;setRound();$('heading').innerHTML='<h2>Les '+(lesson+1)+' · '+LESSONS[lesson].title+'</h2><p>'+LESSONS[lesson].icon+' Weekthema: '+LESSONS[lesson].theme+' · Getallen tot '+max()+'</p>';$('step').textContent='Spel '+(step+1)+' van 4';$('prev').disabled=step===0;$('next').classList.remove('hidden');$('next').textContent='Volgend spel →';$('next').disabled=step===3;$('finish').classList.toggle('hidden',step!==3);$('finish').disabled=!solved;$('status').textContent='';$('status').className='status';let h='';if(step===0)h='<h2>'+(lesson<16?'🔎 Waar zie je evenveel?':'🔎 Welk cijfer hoort hierbij?')+'</h2><div class="objects">'+obj(round.n)+'</div>'+opts(round.choices);if(step===1)h='<h2>🧺 Waar zijn er meer?</h2><div class="pairs"><button class="basket" data-answer="links"><b>Links</b><div class="objects">'+obj(round.a)+'</div></button><button class="basket" data-answer="rechts"><b>Rechts</b><div class="objects">'+obj(round.b)+'</div></button></div>';if(step===2&&lesson<16)h='<h2>👆 Tel de plaatjes samen</h2><div class="objects">'+obj(round.a+round.b)+'</div>'+opts(round.choices);else if(step===2)h='<h2>➕ Hoeveel zijn het samen?</h2><div class="sum"><div class="objects">'+obj(round.a)+'</div><span>+</span><div class="objects">'+obj(round.b)+'</div><span>= ?</span></div>'+opts(round.choices);if(step===3)h='<h2>✨ Wat gebeurt er als we erbij doen?</h2><div class="objects">'+obj(round.a)+'</div><p>Er komen '+round.b+' bij. Zijn dat <b>meer</b> of <b>minder</b>?</p>'+opts(['meer','minder']);$('game').innerHTML=h;$('game').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));}function answer(value){if(solved)return;let ok=String(value)===String(round.correct);beep(ok);$('status').textContent=ok?['🌟 Super gedaan!','🎉 Goed gekeken!','💛 Wat knap samen!'][rnd(0,2)]:'💛 Kijk nog eens goed en probeer opnieuw!';$('status').className='status '+(ok?'success':'error');if(ok){solved=true;$('finish').disabled=step!==3;$('game').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').textContent='Volgend spel →'}}$('prev').onclick=()=>{if(step>0){step--;render();window.scrollTo(0,0)}};$('next').onclick=()=>{if(step<3){step++;render();window.scrollTo(0,0)}};$('finish').onclick=()=>{if(!solved)return;done.add(lesson);localStorage.setItem(KEY,JSON.stringify([...done]));$('play').classList.add('hidden');$('home').classList.remove('hidden');update();window.scrollTo(0,0)};$('retry').onclick=render;$('back').onclick=()=>{$('play').classList.add('hidden');$('home').classList.remove('hidden');update()};$('sound').onclick=()=>{sound=!sound;localStorage.setItem(KEY+'-sound',sound?'on':'off');update()};update();const requestedLesson=Number(new URLSearchParams(location.search).get('les'));if(Number.isInteger(requestedLesson)&&requestedLesson>=1&&requestedLesson<=LESSONS.length)openLesson(requestedLesson-1);
</script></body></html>
